<!-- ==========================================================
     米 kome — la app entera en un archivo.

     1. ESTILOS      el diseño, aquí abajo. Toca lo que quieras.
     2. CONFIG       tu Supabase.
     3. LIBRERÍAS    React, Supabase y el lector de códigos. Comprimido: no tocar.
     4. LA APP       el código de la aplicación, legible y comentado.

     Ábrelo con doble clic para mirarlo, pero para trabajar de verdad

         npx serve
     y entra en http://localhost:3000 — así funciona también la cámara.
     ========================================================== -->

<style>
/* ============================================================
   米 kome — sistema visual "lofi japonés"
   Noche de ciudad, papel washi, luz de farolillo, píxeles gordos.
   ============================================================ */

:root {
  /* --- paleta --- */
  --void: #14121f;
  --night: #1b1830;
  --panel: #241f3b;
  --panel-2: #2e2749;
  --line: #453c6b;
  --line-soft: #362f57;
  --washi: #ede4d3;
  --muted: #9a90b8;
  --muted-2: #6f6693;

  --sakura: #f09bb6; /* proteína */
  --lantern: #f0c069; /* carbohidratos */
  --mizu: #79b0dc; /* grasa / agua */
  --matcha: #9cc97f; /* fibra / bien */
  --kaki: #e5875e; /* aviso */
  --ume: #b98ce0; /* acento frío */

  /* --- rejilla de píxel --- */
  --px: 3px;
  --r: 0px;

  --font-display: "DotGothic16", "Zen Maru Gothic", monospace;
  --font-body: "Zen Maru Gothic", system-ui, sans-serif;
  --font-num: "Silkscreen", "DotGothic16", monospace;

  --safe-b: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body, #root { height: 100%; }

body {
  margin: 0;
  background: var(--void);
  color: var(--washi);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  overscroll-behavior-y: none;
  /* trama de dither muy sutil, como grano de papel */
  background-image:
    repeating-linear-gradient(0deg, rgba(255,255,255,.014) 0 1px, transparent 1px 3px),
    radial-gradient(120% 60% at 50% 0%, #221d3a 0%, var(--void) 62%);
  background-attachment: fixed;
}

img { image-rendering: pixelated; }

button, input, select, textarea {
  font-family: inherit; font-size: inherit; color: inherit;
}

h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 400; margin: 0; letter-spacing: .02em; }

/* ---------- marco de píxel (esquinas mordidas, sin border-radius) ---------- */
.px {
  position: relative;
  background: var(--panel);
  border: var(--px) solid var(--line);
  /* esquinas recortadas al tamaño del píxel */
  clip-path: polygon(
    var(--px) 0, calc(100% - var(--px)) 0, calc(100% - var(--px)) var(--px), 100% var(--px),
    100% calc(100% - var(--px)), calc(100% - var(--px)) calc(100% - var(--px)),
    calc(100% - var(--px)) 100%, var(--px) 100%, var(--px) calc(100% - var(--px)),
    0 calc(100% - var(--px)), 0 var(--px), var(--px) var(--px)
  );
}
.px-flat { border-width: var(--px); }

/* sombra dura estilo sprite */
.drop { box-shadow: var(--px) var(--px) 0 rgba(0,0,0,.55); }

/* ---------- layout ---------- */
.app {
  min-height: 100%;
  padding-bottom: calc(78px + var(--safe-b));
  max-width: 620px;
  margin: 0 auto;
}
.wrap { padding: 0 14px; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; align-items: center; gap: 10px; }
.row-b { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.grow { flex: 1; min-width: 0; }
.center { text-align: center; }

/* ---------- tipografía de apoyo ---------- */
.eyebrow {
  font-family: var(--font-num);
  font-size: 10px;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--muted-2);
}
.kanji { font-family: var(--font-display); color: var(--muted-2); font-size: 12px; letter-spacing: .3em; }
.num { font-family: var(--font-num); letter-spacing: .01em; }
.dim { color: var(--muted); }
.tiny { font-size: 12px; }
.big-num { font-family: var(--font-num); font-size: 44px; line-height: 1; }

/* ---------- botones ---------- */
.btn {
  font-family: var(--font-display);
  background: var(--panel-2);
  color: var(--washi);
  border: var(--px) solid var(--line);
  padding: 10px 14px;
  cursor: pointer;
  position: relative;
  clip-path: polygon(
    var(--px) 0, calc(100% - var(--px)) 0, calc(100% - var(--px)) var(--px), 100% var(--px),
    100% calc(100% - var(--px)), calc(100% - var(--px)) calc(100% - var(--px)),
    calc(100% - var(--px)) 100%, var(--px) 100%, var(--px) calc(100% - var(--px)),
    0 calc(100% - var(--px)), 0 var(--px), var(--px) var(--px)
  );
  transition: transform .06s steps(2), background .12s;
}
.btn:hover { background: #3a3159; }
.btn:active { transform: translate(var(--px), var(--px)); }
.btn:focus-visible { outline: var(--px) solid var(--lantern); outline-offset: 2px; }
.btn-primary { background: var(--sakura); color: #2a1622; border-color: #c76f8c; font-weight: 700; }
.btn-primary:hover { background: #f7add0; }
.btn-ghost { background: transparent; border-color: var(--line-soft); color: var(--muted); }
.btn-sm { padding: 6px 10px; font-size: 13px; }
.btn-block { width: 100%; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

.icon-btn {
  background: transparent; border: none; color: var(--muted);
  padding: 8px; cursor: pointer; line-height: 1;
}
.icon-btn:hover { color: var(--washi); }

/* ---------- campos ---------- */
.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-family: var(--font-num); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted-2); }
.input, select.input, textarea.input {
  background: var(--night);
  border: var(--px) solid var(--line-soft);
  color: var(--washi);
  padding: 10px 11px;
  width: 100%;
  outline: none;
}
.input:focus { border-color: var(--sakura); }
/* valor puesto por el lector de etiquetas: repásalo */
.input.ocr { border-color: var(--lantern); }
.input.ocr:focus { border-color: var(--sakura); }
textarea.input { resize: vertical; min-height: 76px; }
select.input { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: right 14px center, right 8px center; background-size: 6px 6px; background-repeat: no-repeat; }

/* ---------- chips ---------- */
.chips { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto; font-family: var(--font-display); font-size: 13px;
  padding: 6px 11px; background: var(--panel); color: var(--muted);
  border: var(--px) solid var(--line-soft); cursor: pointer; white-space: nowrap;
}
.chip[data-on="true"] { background: var(--washi); color: var(--void); border-color: var(--washi); }

/* ---------- barra de píxeles segmentada ---------- */
.pxbar {
  --fill: 0%;
  --c: var(--washi);
  height: 14px;
  background: var(--night);
  border: var(--px) solid var(--line-soft);
  position: relative;
  overflow: hidden;
}
.pxbar > i {
  display: block; height: 100%; width: var(--fill);
  background: var(--c);
  transition: width .35s steps(12);
}
/* rejilla que trocea la barra en bloques */
.pxbar::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(90deg, transparent 0 5px, var(--night) 5px 8px);
  opacity: .85;
}
.pxbar[data-over="true"] > i { background: repeating-linear-gradient(135deg, var(--kaki) 0 6px, #b3603c 6px 12px); }

/* ---------- tarjetas de comida ---------- */
.meal { padding: 12px; }
.meal + .meal { margin-top: 12px; }
.entry {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 0; border-top: 1px dashed var(--line-soft);
}
.entry:first-of-type { border-top: none; }

/* ---------- rejilla de recetas ---------- */
.rgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
@media (min-width: 560px) { .rgrid { grid-template-columns: repeat(3, 1fr); } }
.rcard { padding: 0; overflow: hidden; cursor: pointer; background: var(--panel); }
.rcard .thumb {
  aspect-ratio: 1 / 1; width: 100%; object-fit: cover; display: block;
  background: var(--night); border-bottom: var(--px) solid var(--line);
}
.rcard .meta { padding: 8px 9px 10px; }

/* ---------- lightbox ---------- */
.lightbox {
  position: fixed; inset: 0; z-index: 90; background: rgba(10,8,18,.94);
  display: flex; align-items: center; justify-content: center; padding: 16px;
}
.lightbox img { max-width: 100%; max-height: 84vh; border: var(--px) solid var(--line); }

/* ---------- modal ---------- */
.sheet-bg {
  position: fixed; inset: 0; z-index: 80; background: rgba(10,8,18,.8);
  display: flex; align-items: flex-end; justify-content: center;
  animation: fade .18s steps(3);
}
@media (min-width: 620px) { .sheet-bg { align-items: center; } }
.sheet {
  width: 100%; max-width: 620px; max-height: 92vh; overflow-y: auto;
  background: var(--night); border-top: var(--px) solid var(--line);
  padding: 14px 14px calc(18px + var(--safe-b));
  animation: rise .22s steps(5);
}
@media (min-width: 620px) { .sheet { border: var(--px) solid var(--line); max-height: 86vh; } }
@keyframes rise { from { transform: translateY(28px); } to { transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

.sheet-head { position: sticky; top: -14px; background: var(--night); padding: 4px 0 10px; margin: -4px 0 8px; z-index: 2; }

/* ---------- navegación inferior ---------- */
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
  display: flex; justify-content: center;
  background: linear-gradient(180deg, rgba(20,18,31,0) 0%, var(--void) 38%);
  padding: 14px 10px calc(10px + var(--safe-b));
  pointer-events: none;
}
.nav-inner {
  pointer-events: auto;
  display: grid; grid-template-columns: repeat(5, 1fr);
  width: 100%; max-width: 470px;
  background: var(--panel); border: var(--px) solid var(--line);
}
.nav-btn {
  background: none; border: none; cursor: pointer; padding: 8px 2px 6px;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  color: var(--muted-2); font-family: var(--font-display); font-size: 11px;
}
@media (max-width: 370px) {
  .nav-btn { padding: 7px 0 5px; }
}
.nav-btn[data-on="true"] { color: var(--washi); background: var(--panel-2); }
.nav-btn[data-on="true"] .dotmark { background: var(--sakura); }
.dotmark { width: 6px; height: 6px; background: transparent; }

/* ---------- pantalla de perfiles ---------- */
.gate {
  min-height: 100dvh; display: flex; flex-direction: column;
  align-items: center; justify-content: center; padding: 28px 16px; gap: 26px;
}
.gate-grid { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; max-width: 520px; }
.gate-card {
  background: none; border: none; cursor: pointer; padding: 0;
  display: flex; flex-direction: column; align-items: center; gap: 9px;
  width: 104px; color: var(--muted);
  transition: transform .1s steps(2);
}
.gate-card:hover, .gate-card:focus-visible { transform: translateY(-4px); color: var(--washi); outline: none; }
.gate-card:hover .avatar { border-color: var(--washi); }
.avatar {
  width: 92px; height: 92px; display: grid; place-items: center;
  font-size: 42px; border: var(--px) solid var(--line);
  background: var(--panel); position: relative;
}
.avatar::after {
  content: ""; position: absolute; inset: 0;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,.14) 0 2px, transparent 2px 4px);
  pointer-events: none;
}

/* ---------- misc ---------- */
.divider { height: var(--px); background: var(--line-soft); border: none; margin: 4px 0; }
.tag {
  font-family: var(--font-num); font-size: 9px; letter-spacing: .1em;
  padding: 3px 6px; background: var(--panel-2); color: var(--muted); text-transform: uppercase;
}
.scroll-x { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; }
.scroll-x::-webkit-scrollbar { display: none; }

.blink { animation: blink 1.1s steps(2, start) infinite; }
@keyframes blink { 50% { opacity: 0; } }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(96px + var(--safe-b)); z-index: 95;
  background: var(--washi); color: var(--void); font-family: var(--font-display);
  padding: 9px 14px; border: var(--px) solid #b9ae99;
  animation: fade .15s steps(2);
}

.empty { padding: 26px 14px; text-align: center; color: var(--muted-2); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

/* ============================================================
   TEMA "CLARO Y GRANDE"
   Pensado para leerse sin esfuerzo: fondo claro, texto casi
   negro, tipografía más grande y nada de adornos que estorben.
   Sigue siendo un diseño cuidado — tarjetas, aire y un acento
   único — pero minimalista, sin píxeles ni japonés.
   ============================================================ */

:root[data-theme="claro"] {
  /* fondos */
  --void: #f4f3f0;      /* papel de fondo */
  --night: #ffffff;     /* campos de formulario */
  --panel: #ffffff;     /* tarjetas */
  --panel-2: #eceae5;   /* superficies secundarias */

  /* trazos */
  --line: #d5d2ca;
  --line-soft: #ded9d0;
  --edge: #15171b;      /* borde fuerte para lo interactivo */

  /* texto: contraste alto sobre blanco */
  --washi: #15171b;     /* principal, casi negro */
  --muted: #3d434b;     /* secundario, sigue siendo legible */
  --muted-2: #5b626b;   /* terciario */

  /* acentos oscurecidos para que contrasten sobre claro */
  --sakura: #a3145a;    /* proteína / acento principal */
  --lantern: #8a5200;   /* carbohidratos */
  --mizu: #10557f;      /* grasa / agua */
  --matcha: #1f6b35;    /* fibra / bien */
  --kaki: #ad3315;      /* aviso */
  --ume: #5c34a3;       /* acento frío */

  --px: 1px;
  --r: 12px;

  --font-display: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-num: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

/* ---------- base ---------- */
:root[data-theme="claro"] body {
  background-image: none;
  background: var(--void);
  font-size: 18px;
  line-height: 1.6;
  letter-spacing: 0;
  -webkit-font-smoothing: antialiased;
}
:root[data-theme="claro"] img { image-rendering: auto; }
:root[data-theme="claro"] h1,
:root[data-theme="claro"] h2,
:root[data-theme="claro"] h3,
:root[data-theme="claro"] h4 { font-weight: 700; letter-spacing: -0.015em; }
:root[data-theme="claro"] .num { font-variant-numeric: tabular-nums; letter-spacing: 0; }

/* nada de japonés ni parpadeos */
:root[data-theme="claro"] .kanji { display: none; }
:root[data-theme="claro"] .blink { animation: none; }

/* ---------- tarjetas ---------- */
:root[data-theme="claro"] .px {
  clip-path: none;
  border: 1px solid var(--line);
  border-radius: var(--r);
  background: var(--panel);
}
:root[data-theme="claro"] .drop { box-shadow: 0 1px 2px rgba(20, 23, 27, .05), 0 6px 18px rgba(20, 23, 27, .06); }

/* ---------- tipografía de apoyo ---------- */
:root[data-theme="claro"] .eyebrow {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: .04em;
  text-transform: none;
  color: var(--muted-2);
}
:root[data-theme="claro"] .tiny { font-size: 15px; }
:root[data-theme="claro"] .dim { color: var(--muted); }
:root[data-theme="claro"] .big-num { font-size: 54px; font-weight: 800; letter-spacing: -.03em; }

/* ---------- botones ---------- */
:root[data-theme="claro"] .btn {
  clip-path: none;
  border-radius: 10px;
  border: 2px solid var(--edge);
  background: var(--panel);
  color: var(--washi);
  font-weight: 600;
  font-size: 17px;
  padding: 13px 18px;
  transition: background .12s, transform .06s;
}
:root[data-theme="claro"] .btn:hover { background: var(--panel-2); }
:root[data-theme="claro"] .btn:active { transform: none; background: #e2dfd8; }
:root[data-theme="claro"] .btn:focus-visible { outline: 3px solid var(--sakura); outline-offset: 2px; }
:root[data-theme="claro"] .btn-primary {
  background: var(--sakura); border-color: var(--sakura); color: #fff; font-weight: 700;
}
:root[data-theme="claro"] .btn-primary:hover { background: #8a1049; border-color: #8a1049; }
:root[data-theme="claro"] .btn-ghost { background: transparent; border-color: var(--line); color: var(--muted); }
:root[data-theme="claro"] .btn-ghost:hover { background: var(--panel-2); color: var(--washi); }
:root[data-theme="claro"] .btn-sm { padding: 9px 14px; font-size: 15px; }
:root[data-theme="claro"] .icon-btn { color: var(--muted); font-size: 19px; padding: 10px; }
:root[data-theme="claro"] .icon-btn:hover { color: var(--washi); }

/* ---------- campos ---------- */
:root[data-theme="claro"] .field label {
  font-size: 15px; font-weight: 600; letter-spacing: 0; text-transform: none; color: var(--muted);
}
:root[data-theme="claro"] .input,
:root[data-theme="claro"] select.input,
:root[data-theme="claro"] textarea.input {
  border: 2px solid var(--line);
  border-radius: 10px;
  padding: 13px 14px;
  font-size: 17px;
  background-color: var(--night);
  color: var(--washi);
}
:root[data-theme="claro"] .input::placeholder { color: #8d939b; }
:root[data-theme="claro"] .input:focus { border-color: var(--sakura); box-shadow: 0 0 0 3px rgba(163, 20, 90, .13); }
:root[data-theme="claro"] select.input {
  background-image:
    linear-gradient(45deg, transparent 50%, var(--washi) 50%),
    linear-gradient(135deg, var(--washi) 50%, transparent 50%);
  background-position: right 18px center, right 11px center;
  background-size: 7px 7px;
  background-repeat: no-repeat;
  padding-right: 38px;
}
:root[data-theme="claro"] input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--sakura); }
:root[data-theme="claro"] input[type="range"] { accent-color: var(--sakura); height: 26px; }

/* ---------- chips ---------- */
:root[data-theme="claro"] .chip {
  border-radius: 999px;
  border: 2px solid var(--line);
  padding: 9px 16px;
  font-size: 16px;
  font-weight: 600;
  color: var(--muted);
  background: var(--panel);
}
:root[data-theme="claro"] .chip[data-on="true"] {
  background: var(--washi); color: #fff; border-color: var(--washi);
}

/* ---------- barras ---------- */
:root[data-theme="claro"] .pxbar {
  height: 16px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--panel-2);
}
:root[data-theme="claro"] .pxbar::after { display: none; }
:root[data-theme="claro"] .pxbar > i { border-radius: 999px; transition: width .3s ease; }
:root[data-theme="claro"] .pxbar[data-over="true"] > i { background: var(--kaki); }

/* ---------- listas ---------- */
:root[data-theme="claro"] .entry {
  border-top: 1px solid var(--line-soft);
  padding: 12px 0;
}
:root[data-theme="claro"] .divider { height: 1px; background: var(--line-soft); }
:root[data-theme="claro"] .tag {
  font-size: 13px; font-weight: 600; letter-spacing: 0; text-transform: none;
  border-radius: 999px; padding: 4px 11px; background: var(--panel-2); color: var(--muted);
}

/* ---------- recetas ---------- */
:root[data-theme="claro"] .rcard .thumb { border-bottom: 1px solid var(--line); }
:root[data-theme="claro"] .rcard .meta { padding: 11px 12px 13px; }

/* ---------- hojas y ventanas ---------- */
:root[data-theme="claro"] .sheet-bg { background: rgba(20, 23, 27, .45); }
:root[data-theme="claro"] .sheet {
  background: var(--void);
  border-top: none;
  border-radius: 18px 18px 0 0;
  box-shadow: 0 -8px 40px rgba(20, 23, 27, .18);
}
@media (min-width: 620px) {
  :root[data-theme="claro"] .sheet { border: 1px solid var(--line); border-radius: 18px; }
}
:root[data-theme="claro"] .sheet-head { background: var(--void); }
:root[data-theme="claro"] .lightbox { background: rgba(20, 23, 27, .92); }
:root[data-theme="claro"] .lightbox img { border: 1px solid var(--line); border-radius: 10px; }

/* ---------- navegación inferior ---------- */
:root[data-theme="claro"] .nav {
  background: linear-gradient(180deg, rgba(244, 243, 240, 0) 0%, var(--void) 40%);
}
:root[data-theme="claro"] .nav-inner {
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--panel);
  box-shadow: 0 2px 16px rgba(20, 23, 27, .09);
  overflow: hidden;
}
:root[data-theme="claro"] .nav-btn {
  color: var(--muted-2);
  font-size: 13px;
  font-weight: 600;
  padding: 11px 2px 9px;
  gap: 4px;
}
:root[data-theme="claro"] .nav-btn[data-on="true"] {
  color: #fff; background: var(--washi);
}
:root[data-theme="claro"] .nav-btn[data-on="true"] .dotmark { background: transparent; }

/* ---------- perfiles ---------- */
:root[data-theme="claro"] .avatar {
  border: 2px solid var(--line);
  border-radius: 20px;
  background: var(--panel);
}
:root[data-theme="claro"] .avatar::after { display: none; }
:root[data-theme="claro"] .gate-card { color: var(--muted); }
:root[data-theme="claro"] .gate-card:hover .avatar { border-color: var(--washi); }

/* ---------- avisos ---------- */
:root[data-theme="claro"] .toast {
  background: var(--washi); color: #fff; border: none;
  border-radius: 12px; padding: 13px 20px; font-size: 16px; font-weight: 600;
  box-shadow: 0 6px 24px rgba(20, 23, 27, .3);
}
:root[data-theme="claro"] .empty { color: var(--muted); font-size: 16px; }

/* ---------- subpestañas (Recetas / Ingredientes) ---------- */
.subtabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0;
  border: var(--px) solid var(--line);
  background: var(--panel);
}
.subtab {
  background: none; border: none; cursor: pointer;
  padding: 11px 8px;
  font-family: var(--font-display);
  font-size: 15px;
  color: var(--muted-2);
  border-bottom: var(--px) solid transparent;
}
.subtab[data-on="true"] { color: var(--washi); background: var(--panel-2); border-bottom-color: var(--sakura); }

:root[data-theme="claro"] .subtabs {
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 4px;
  gap: 4px;
  background: var(--panel-2);
}
:root[data-theme="claro"] .subtab {
  border-radius: 9px;
  border-bottom: none;
  font-size: 17px;
  font-weight: 600;
  padding: 12px 8px;
  color: var(--muted);
}
:root[data-theme="claro"] .subtab[data-on="true"] {
  background: var(--washi); color: #fff;
}

/* ---------- pantalla completa ---------- */
.fs {
  position: fixed; inset: 0; z-index: 85;
  display: flex; flex-direction: column;
  background: var(--void);
}
.fs-head {
  flex: 0 0 auto;
  display: flex; align-items: center; gap: 8px;
  padding: calc(10px + env(safe-area-inset-top, 0px)) 12px 10px;
  background: var(--panel);
  border-bottom: var(--px) solid var(--line);
}
.fs-body {
  flex: 1 1 auto; overflow-y: auto;
  padding: 14px 14px calc(24px + var(--safe-b));
  max-width: 620px; width: 100%; margin: 0 auto;
}
:root[data-theme="claro"] .fs-head { border-bottom: 1px solid var(--line); }

/* ---------- letra menuda de gráficos y barras ---------- */
.micro { font-size: 9px; color: var(--muted-2); }
:root[data-theme="claro"] .micro { font-size: 12px; font-weight: 500; color: var(--muted-2); }

</style>
